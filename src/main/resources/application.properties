server.port=${PORT:8080}

# Spring DataSource
# If MYSQL_URL is provided, use MySQL; otherwise use embedded H2 database (zero configuration needed)
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:csrm_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${MYSQLUSER:sa}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson Datetime
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Security / JWT
csrm.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
csrm.jwt.expiration-ms=86400000

# Logging
logging.level.com.kiot.csrm=INFO
logging.level.org.springframework.security=WARN
