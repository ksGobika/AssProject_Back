server.port=${PORT:8080}

# Spring DataSource (MySQL 8.0 / Railway Cloud Support)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:AssProject_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Gobika@04}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson Datetime
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Security / JWT
csrm.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
csrm.jwt.expiration-ms=86400000

# Logging
logging.level.com.kiot.csrm=INFO
logging.level.org.springframework.security=WARN
